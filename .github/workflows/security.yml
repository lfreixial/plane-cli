name: Security
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Vulnerabilities (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan supported architectures
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: '0'
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" govulncheck ./...
          done
